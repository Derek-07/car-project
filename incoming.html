<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Performance - Coming Soon</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body, html {
      height: 100%;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      background: #000;
    }

    /* VIDEO BACKGROUND */
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
      filter: brightness(0.35) contrast(1.1);
    }

    /* LUXURY OVERLAY */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0,0,0,0.4), rgba(0,0,0,0.95));
      backdrop-filter: blur(6px);
      z-index: -2;
    }

    /* GOLD GRAIN EFFECT */
    .grain {
      position: fixed;
      width: 100%;
      height: 100%;
      background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
      opacity: 0.2;
      z-index: -1;
    }

    /* NAVBAR */
    .navbar-brand {
      font-weight: 700;
      color: #d4af37 !important;
      letter-spacing: 2px;
      font-size: 20px;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 120px 0 72px;
    }

    .coming-box {
      border: 1px solid rgba(212,175,55,0.3);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.6);
      box-shadow: 0 0 60px rgba(212,175,55,0.15);
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .coming-box h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      color: #d4af37;
      letter-spacing: 3px;
    }

    .coming-box h2 {
      font-size: 18px;
      color: #aaa;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .coming-box p {
      color: #ccc;
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* BUTTON */
    .btn-gold {
      background: linear-gradient(45deg, #d4af37, #ffd700);
      border: none;
      padding: 12px 35px;
      border-radius: 50px;
      color: black;
      font-weight: 600;
      letter-spacing: 1px;
      transition: 0.3s ease;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(212,175,55,0.6);
    }

    /* TRACK LINE */
    .track-line {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 5px;
      background: repeating-linear-gradient(
        to right,
        #d4af37,
        #d4af37 20px,
        transparent 20px,
        transparent 40px
      );
      animation: moveTrack 1s linear infinite;
    }

    @keyframes moveTrack {
      from { background-position: 0 0; }
      to { background-position: 40px 0; }
    }

    footer {
      color: #777;
      font-size: 12px;
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }

    /* MOBILE OPTIMIZATION */
    @media(max-width: 768px){
      .navbar {
        padding-left: 0 !important;
        padding-right: 0 !important;
      }

      .hero {
        min-height: auto;
        padding: 120px 0 48px;
      }

      .coming-box {
        padding: 25px;
        border-radius: 16px;
      }

      .coming-box h1 {
        font-size: 2rem;
      }

      .coming-box h2 {
        font-size: 15px;
        letter-spacing: 1px;
      }

      .coming-box p {
        font-size: 13px;
      }
    }

    @media (max-width: 575.98px) {
      .hero.container {
        padding-left: 16px;
        padding-right: 16px;
      }

      .coming-box {
        padding: 22px 18px;
      }

      .btn-gold {
        width: 100%;
        padding: 12px 20px;
      }
    }

  </style>
</head>
<body>

  <!-- REPLACE THIS VIDEO WITH YOUR OWN -->
  <video autoplay muted loop playsinline class="video-bg">
    <source src="your-video.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>
  <div class="grain"></div>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark px-4 position-relative z-1">
    <div class="container-fluid">
        <a href="index.html" class="d-inline-flex align-items-center py-3"><img src="assets/img/apc high.png" alt="Apex Performance" style="max-width: 140px; height: auto;"></a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero container">
    <div class="coming-box">
      <h1>COMING SOON</h1>
      <h2>LUXURY PERFORMANCE RENTALS</h2>
      <p>Something extraordinary is arriving in Dubai. Get ready to experience elite driving like never before.</p>
      <button class="btn btn-gold">Notify Me</button>
    </div>
  </section>



  <!-- FOOTER -->
  <footer class="text-center py-3">
    &copy; 2026 APEX PERFORMANCE
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
